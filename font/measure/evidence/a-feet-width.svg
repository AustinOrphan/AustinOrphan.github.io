0" font-family="ui-monospace,Menlo,monospace" font-size="11.5" font-weight="400">as built</text><g transform="translate(450,480) scale(0.3,-0.3)"><path d="M 40.00 0.00 L 89.86 19.93 L 319.87 644.06 L 552.05 16.18 L 598.05 0.00 L 319.03 716.00 Z M 418.31 461.24 C 386.27 452.49 354.50 442.73 323.03 432.13 C 288.19 420.40 253.69 407.63 219.62 393.81 C 209.17 389.57 198.76 385.23 188.39 380.79 L 164.71 320.00 C 170.25 322.32 175.80 324.62 181.36 326.90 C 225.73 345.10 270.60 362.11 315.79 378.14 C 355.33 392.16 395.15 405.44 435.26 417.75 Z M 119.32 203.54 L 120.33 203.86 L 121.62 204.27 L 122.91 204.68 L 124.21 205.10 L 125.53 205.40 L 126.86 205.69 L 128.19 206.00 L 129.53 206.30 L 130.87 206.61 L 132.21 206.92 L 133.56 207.23 L 134.91 207.54 L 136.26 207.86 L 137.62 208.17 L 138.98 208.49 L 140.35 208.82 L 141.71 209.14 L 143.09 209.47 L 144.46 209.80 L 145.83 210.13 L 142.97 222.01 L 141.60 221.68 L 140.24 221.36 L 138.88 221.03 L 137.53 220.71 L 136.17 220.39 L 134.83 220.07 L 133.48 219.76 L 132.14 219.44 L 130.80 219.13 L 129.47 218.83 L 128.14 218.52 L 126.81 218.22 L 125.49 217.92 L 124.87 217.78 Z M 468.40 332.69 L 467.47 332.27 L 466.04 331.66 L 464.62 331.04 L 463.18 330.42 L 461.75 329.80 L 460.31 329.19 L 458.87 328.57 L 457.43 327.96 L 455.99 327.34 L 454.54 326.72 L 453.09 326.11 L 457.92 314.71 L 459.38 315.33 L 460.84 315.95 L 462.29 316.57 L 463.74 317.19 L 465.19 317.81 L 466.64 318.43 L 468.08 319.05 L 469.52 319.67 L 470.96 320.29 L 472.40 320.92 L 472.91 321.13 Z" fill="#6E8494" fill-opacity="0.55"/></g><g transform="translate(450,480) scale(0.3,-0.3)"><path d="M 30.62 0.00 L 82.44 19.93 L 321.47 644.06 L 562.76 16.18 L 610.57 0.00 L 320.60 716.00 Z M 423.77 461.24 C 390.48 452.49 357.46 442.73 324.76 432.13 C 288.55 420.40 252.69 407.63 217.29 393.81 C 206.43 389.57 195.61 385.23 184.84 380.79 L 160.22 320.00 C 165.98 322.32 171.75 324.62 177.53 326.90 C 223.63 345.10 270.27 362.11 317.24 378.14 C 358.32 392.16 399.71 405.44 441.39 417.75 Z M 113