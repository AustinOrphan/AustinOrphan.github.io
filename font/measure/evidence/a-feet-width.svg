<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="940" viewBox="0 0 1500 940"><rect width="1500" height="940" fill="#1D2B35"/><text x="30" y="42" fill="#EEE5E9" font-family="ui-monospace,Menlo,monospace" font-size="20" font-weight="600">Widening the A&#8217;s feet</text><text x="30" y="72" fill="#8FA3B0" font-family="ui-monospace,Menlo,monospace" font-size="12.5" font-weight="400">The spread is not a free parameter. It is 2 x apex height x tan(apex angle / 2), and both of those are fixed by something else: the apex</text><text x="30" y="94" fill="#8FA3B0" font-family="ui-monospace,Menlo,monospace" font-size="12.5" font-weight="400">sits at CAP + OVER_POINT = 716, and the 42.582 deg apex angle is the mark&#8217;s own, shared by the M and the W. Widening opens the angle.</text><g transform="translate(90,480) scale(0.3,-0.3)"><path d="M 40.00 0.00 L 89.86 19.93 L 319.87 644.06 L 552.05 16.18 L 598.05 0.00 L 319.03 716.00 Z M 418.31 461.24 C 386.27 452.49 354.50 442.73 323.03 432.13 C 288.19 420.40 253.69 407.63 219.62 393.81 C 209.17 389.57 198.76 385.23 188.39 380.79 L 164.71 320.00 C 170.25 322.32 175.80 324.62 181.36 326.90 C 225.73 345.10 270.60 362.11 315.79 378.14 C 355.33 392.16 395.15 405.44 435.26 417.75 Z M 119.32 203.54 L 120.33 203.86 L 121.62 204.27 L 122.91 204.68 L 124.21 205.10 L 125.53 205.40 L 126.86 205.69 L 128.19 206.00 L 129.53 206.30 L 130.87 206.61 L 132.21 206.92 L 133.56 207.23 L 134.91 207.54 L 136.26 207.86 L 137.62 208.17 L 138.98 208.49 L 140.35 208.82 L 141.71 209.14 L 143.09 209.47 L 144.46 209.80 L 145.83 210.13 L 142.97 222.01 L 141.60 221.68 L 140.24 221.36 L 138.88 221.03 L 137.53 220.71 L 136.17 220.39 L 134.83 220.07 L 133.48 219.76 L 132.14 219.44 L 130.80 219.13 L 129.47 218.83 L 128.14 218.52 L 126.81 218.22 L 125.49 217.92 L 124.87 217.78 Z M 468.40 332.69 L 467.47 332.27 L 466.04 331.66 L 464.62 331.04 L 463.18 330.42 L 461.75 329.80 L 460.31 329.19 L 458.87 328.57 L 457.43 327.96 L 455.99 327.34 L 454.54 326.72 L 4