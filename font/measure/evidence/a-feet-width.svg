28.57 L 470.82 327.96 L 469.27 327.34 L 467.71 326.72 L 466.15 326.11 L 471.35 314.71 L 472.92 315.33 L 474.49 315.95 L 476.05 316.57 L 477.61 317.19 L 479.17 317.81 L 480.72 318.43 L 482.27 319.05 L 483.82 319.67 L 485.37 320.29 L 486.91 320.92 L 487.46 321.13 Z" fill="#7FCE9B" fill-opacity="0.80"/></g><text x="810" y="514" fill="#7FCE9B" font-family="ui-monospace,Menlo,monospace" font-size="14" font-weight="600">feet 600</text><text x="810" y="536" fill="#8FA3B0" font-family="ui-monospace,Menlo,monospace" font-size="11.5" font-weight="400">apex angle 45.47 deg</text><text x="810" y="556" fill="#8FA3B0" font-family="ui-monospace,Menlo,monospace" font-size="11.5" font-weight="400">+42 wider</text><g transform="translate(1170,480) scale(0.3,-0.3)"><path d="M 40.00 0.00 L 89.86 19.93 L 319.87 644.06 L 552.05 16.18 L 598.05 0.00 L 319.03 716.00 Z M 418.31 461.24 C 386.27 452.49 354.50 442.73 323.03 432.13 C 288.19 420.40 253.69 407.63 219.62 393.81 C 209.17 389.57 198.76 385.23 188.39 380.79 L 164.71 320.00 C 170.25 322.32 175.80 324.62 181.36 326.90 C 225.73 345.10 270.60 362.11 315.79 378.14 C 355.33 392.16 395.15 405.44 435.26 417.75 Z M 119.32 203.54 L 120.33 203.86 L 121.62 204.27 L 122.91 204.68 L 124.21 205.10 L 125.53 205.40 L 126.86 205.69 L 128.19 206.00 L 129.53 206.30 L 130.87 206.61 L 132.21 206.92 L 133.56 207.23 L 134.91 207.54 L 136.26 207.86 L 137.62 208.17 L 138.98 208.49 L 140.35 208.82 L 141.71 209.14 L 143.09 209.47 L 144.46 209.80 L 145.83 210.13 L 142.97 222.01 L 141.60 221.68 L 140.24 221.36 L 138.88 221.03 L 137.53 220.71 L 136.17 220.39 L 134.83 220.07 L 133.48 219.76 L 132.14 219.44 L 130.80 219.13 L 129.47 218.83 L 128.14 218.52 L 126.81 218.22 L 125.49 217.92 L 124.87 217.78 Z M 468.40 332.69 L 467.47 332.27 L 466.04 331.66 L 464.62 331.04 L 463.18 330.42 L 461.75 329.80 L 460.31 329.19 L 458.87 328.57 L 457.43 327.96 L 455.99 327.34 L 454.54 326.72 L 453.09 326.11 L 457.92 314.71 L 459.38 315.33 L 460.84 315.95 L 462.29 316.57 L 463.74 317.19 L 465.19 317.81 L 466.64 318.43 L 468.08 319.05 L 469.52 319.67 L 470.96 320.29 L 472.40 320.92 L 472.91 321.13 Z" fill="#6E8494" fill-opacity="0.55"/></g><g transform="translate(1170,480) scale(0.3,-0.3)"><path d="M 13.49 0.00 L 68.88 19.93 L 324.40 644.06 L 582.33 16.18 L 633.44 0.00 L 323.46 716.00 Z M 433.75 461.24 C 398.16 452.49 362.87 442.73 327.91 432.13 C 289.21 420.40 250.88 407.63 213.03 393.81 C 201.42 389.57 189.86 385.23 178.34 380.79 L 152.02 320.00 C 158.18 322.32 164.35 324.62 170.53 326.90 C 219.81 345.10 269.66 362.11 319.87 378.14 C 363.79 392.16 408.03 405.44 452.58 417.75 Z M 101.61 203.54 L 102.73 203.86 L 104.16 204.27 L 105.60 204.68 L 107.03 205.10 L 108.51 205.40 L 109.98 205.69 L 111.46 206.00 L 112.95 206.30 L 114.43 206.61 L 115.93 206.92 L 117.42 207.23 L 118.92 207.54 L 120.43 207.86 L 121.94 208.17 L 123.45 208.49 L 124.96 208.82 L 126.48 209.14 L 128.01 209.47 L 129.53 209.80 L 131.06 210.13 L 127.88 222.01 L 126.36 221.68 L 124.84 221.36 L 123.34 221.03 L 121.83 220.71 L 120.33 220.39 L 118.83 220.07 L 117.34 219.76 L 115.85 219.44 L 114.36 219.13 L 112.88 218.83 L 111.40 218.52 L 109.93 218.22 L 108.46 217.92 L 107.77 217.78 Z M 489.40 332.69 L 488.37 332.27 L 486.78 331.66 L 485.20 331.04 L 483.61 330.42 L 482.01 329.80 L 480.42 329.19 L 478.82 328.57 L 477.22 327.96 L 475.61 327.34 L 474.00 326.72 L 472.39 326.11 L 477.76 314.71 L 479.38 315.33 L 481.00 315.95 L 482.62 316.57 L 484.23 317.19 L 485.84 317.81 L 487.44 318.43 L 489.05 319.05 L 490.65 319.67 L 492.25 320.29 L 493.84 320.92 L 494.41 321.13 Z" fill="#7FCE9B" fill-opacity="0.80"/></g><text x="1170" y="514" fill="#7FCE9B" font-family="ui-monospace,Menlo,monospace" font-size="14" font-weight="600">feet 620</text><text x="1170" y="536" fill="#8FA3B0" font-family="ui-monospace,Menlo,monospace" font-size="11.5" font-weight="400">apex angle 46.82 deg</text><text x="1170" y="556" fill="#8FA3B0" font-family="ui-monospace,Menlo,monospace" font-size="11.5" font-weight="400">+62 wider</text><text x="30" y="620" fill="#EEE5E9" font-family="ui-monospace,Menlo,monospace" font-size="14" font-weight="600">What it costs</text><text x="30" y="648" fill="#8FA3B0" font-family="ui-monospace,Menlo,monospace" font-size="12" font-weight="400">The apex angle is not the A&#8217;s alone. SPEC R8: &#8220;every pointed construction (V, W, M, N, K, X, Y) uses the A&#8217;s apex angle, 42.6 deg&#8221;.</text><text x="30" y="670" fill="#8FA3B0" font-family="ui-monospace,Menlo,monospace" font-size="12" font-weight="400">Opening it to 44.1 to gain 22 units at the A&#8217;s feet reopens all of them, and the M and W were solved against that angle only recently.</text><text x="30" y="698" fill="#8FA3B0" font-family="ui-monospace,Menlo,monospace" font-size="12" font-weight="400">The foot spread is not the A&#8217;s alone either. R8 takes it as the MEDIUM body width, 558, and builds H N U V X Y K T Z D B P R and</text><text x="30" y="720" fill="#8FA3B0" font-family="ui-monospace,Menlo,monospace" font-size="12" font-weight="400">all ten digits to it. Widening the A widens the medium class or breaks the derivation that says they are the same number.</text><text x="30" y="756" fill="#8FA3B0" font-family="ui-monospace,Menlo,monospace" font-size="12" font-weight="400">The alternative is to raise the apex instead, keeping the angle: 580 needs an apex at 744 and 600 needs 770, against the 716 that</text><text x="30" y="778" fill="#8FA3B0" font-family="ui-monospace,Menlo,monospace" font-size="12" font-weight="400">CAP + OVER_POINT gives. That is a cap-height change, which moves every glyph in the face.</text><text x="30" y="822" fill="#EEE5E9" font-family="ui-monospace,Menlo,monospace" font-size="12.5" font-weight="600">So: it is a three-way choice, not a tweak. Open the apex angle (M, W, V, N, K, X, Y follow), raise the cap (everything follows),</text><text x="30" y="844" fill="#EEE5E9" font-family="ui-monospace,Menlo,monospace" font-size="12.5" font-weight="600">or let the A stop defining the medium width and be the one letter that does not derive from itself.</text><text x="30" y="886" fill="#8FA3B0" font-family="ui-monospace,Menlo,monospace" font-size="12" font-weight="400">Worth adding: at 558 the A is already the widest thing in its class at the baseline, and its triangle puts less mass at the top than</text><text x="30" y="908" fill="#8FA3B0" font-family="ui-monospace,Menlo,monospace" font-size="12" font-weight="400">the H or the D, so it reads narrower than it measures. If the feet look tight, the honest fix may be spacing rather than geometry.</text></svg>