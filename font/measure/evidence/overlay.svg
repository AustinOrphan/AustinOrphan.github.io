<text x="10" y="922" fill="#EEE5E9" font-family="monospace" font-size="12">source (grey) &#183; font O (blue) &#183; font A (red), mapped back to the source frame. Where a coloured edge hugs the grey, they register.</text><text x="10" y="940" fill="#8FA3B0" font-family="monospace" font-size="11">Apex 0.000 pt off, counter apex 0.069. The four FOOT vertices sit 0.83-0.89 off, and cannot do better: the source A&#8217;s two feet differ by 8.54 pt in y and build_A levels them.</text><text x="10" y="956" fill="#8FA3B0" font-family="monospace" font-size="11">The two small red shapes on the legs are the ring&#8217;s tails, which continue behind the legs in the font and have no counterpart in the source A.</text></svg>