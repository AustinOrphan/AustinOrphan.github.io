<svg xmlns="http://www.w3.org/2000/svg" width="1520" height="940" viewBox="0 0 1520 940"><rect width="1520" height="940" fill="#1D2B35"/><text x="30" y="42" text-anchor="start" fill="#EEE5E9" font-family="ui-monospace,Menlo,monospace" font-size="20" font-weight="600">Why the A cannot just be rotated</text><text x="30" y="72" text-anchor="start" fill="#8FA3B0" font-family="ui-monospace,Menlo,monospace" font-size="12.5" font-weight="400">The mark asks for three things at once: feet level on the baseline, the apex centred between them, and the leg bisector vertical.</text><text x="30" y="94" text-anchor="start" fill="#8FA3B0" font-family="ui-monospace,Menlo,monospace" font-size="12.5" font-weight="400">No rotation gives all three, because in the drawing they disagree. Each panel is the same six vertices, rotated about the apex,</text><text x="30" y="116" text-anchor="start" fill="#8FA3B0" font-family="ui-monospace,Menlo,monospace" font-size="12.5" font-weight="400">then re-centred on its own feet so the four can be compared.</text><line x1="43.1" y1="675.0" x2="356.9" y2="705.0" stroke="#3D5361" stroke-width="1.5"/><line x1="200.0" y1="706.0" x2="200.0" y2="347.7" stroke="#3D5361" stroke-width="1.2" stroke-dasharray="5 4"/><path d="M 77.06 675.05 L 100.04 668.39 L 227.28 405.76 L 303.13 695.71 L 322.94 704.95 L 230.05 373.72 Z" fill="#EEE5E9" fill-opacity="0.30" stroke="#EEE5E9" stroke-opacity="0.60" stroke-width="1.2"/><circle cx="230.1" cy="373.7" r="3.6" fill="#EEE5E9"/><text x="70" y="168" text-anchor="start" fill="#EEE5E9" font-family="ui-monospace,Menlo,monospace" font-size="13" font-weight="600">1. as drawn</text><text x="70" y="200" text-anchor="start" fill="#8FA3B0" font-family="ui-monospace,Menlo,monospace" font-size="11.5" font-weight="400">feet level</text><text x="330" y="200" text-anchor="end" fill="#E8825C" font-family="ui-monospace,Menlo,monospace" font-size="11.5" font-weight="600">-8.543 pt</text><text x="70" y="220" text-anchor="start" fill="#8FA3B0" font-family="ui-monospace,Menlo,monospace" font-size="11.5" font-weight="400">apex centred</text><text x="330" y="220" text-anchor="end" fill="#E8825C" font-family="ui-monospace,Menlo,monospace" font-size="11.5" font-weight="600">+8.586 pt</text><text x="70" y="240" text-anchor="start" fill="#8FA3B0" font-family="ui-monospace,Menlo,monospace" font-size="11.5" font-weight="400">axis vertical</text><text x="330" y="240" text-anchor="end" fill="#E8825C" font-family="ui-monospace,Menlo,monospace" font-size="11.5" font-weight="600">-5.626 deg</text><text x="70" y="260" text-anchor="start" fill="#8FA3B0" font-family="ui-monospace,Menlo,monospace" font-size="11.5" font-weight="400">apex angle</text><text x="330" y="260" text-anchor="end" fill="#7FCE9B" font-family="ui-monospace,Menlo,monospace" font-size="11.5" font-weight="600">42.582 deg</text><line x1="392.2" y1="687.2" x2="707.8" y2="692.8" stroke="#3D5361" stroke-width="1.5"/><line x1="550.0" y1="706.0" x2="550.0" y2="346.3" stroke="#3D5361" stroke-width="1.2" stroke-dasharray="5 4"/><path d="M 426.19 687.17 L 448.40 678.29 L 549.28 404.46 L 653.19 685.58 L 673.81 692.83 L 548.90 372.30 Z" fill="#EEE5E9" fill-opacity="0.30" stroke="#EEE5E9" stroke-opacity="0.60" stroke-width="1.2"/><circle cx="548.9" cy="372.3" r="3.6" fill="#EEE5E9"/><text x="420" y="168" text-anchor="start" fill="#EEE5E9" font-family="ui-monospace,Menlo,monospace" font-size="13" font-weight="600">2. rotated by the LEAN  +5.6265</text><text x="420" y="200" text-anchor="start" fill="#8FA3B0" font-family="ui-monospace,Menlo,monospace" font-size="11.5" font-weight="400">feet level</text><text x="680" y="200" text-anchor="end" fill="#E8825C" font-family="ui-monospace,Menlo,monospace" font-size="11.5" font-weight="600">-1.614 pt</text><text x="420" y="220" text-anchor="start" fill="#8FA3B0" font-family="ui-monospace,Menlo,monospace" font-size="11.5" font-weight="400">apex centred</text><text x="680" y="220" text-anchor="end" fill="#E8825C" font-family="ui-monospace,Menlo,monospace" font-size="11.5" font-weight="600">-0.315 pt</text><text x="420" y="240" text-anchor="start" fill="#8FA3B0" font-family="ui-monospace,Menlo,monospace" font-size="11.5" font-weight="400">axis vertical</text><text x="680" y="240" text-anchor="end" fill="#7FCE9B" font-family="ui-monospace,Menlo,monospace" font-size="11.5" font-weight="600">+0.000 deg</text><text x="420" y="260" text-anchor="start" fill="#8FA3B0" font-family="ui-monospace,Menlo,monospace" font-size="11.5" font-weight="400">apex angle</text><text x="680" y="260" text-anchor="end" fill="#7FCE9B" font-family="ui-monospace,Menlo,monospace" font-size="11.5" font-weight="600">42.582 deg</text><line x1="742.2" y1="690.0" x2="1057.8" y2="690.0" stroke="#3D5361" stroke-width="1.5"/><line x1="900.0" y1="706.0" x2="900.0" y2="346.4" stroke="#3D5361" stroke-width="1.2" stroke-dasharray="5 4"/><path d="M 776.16 690.00 L 798.16 680.61 L 892.76 404.55 L 1003.06 683.22 L 1023.84 690.00 L 891.65 372.41 Z" fill="#EEE5E9" fill-opacity="0.30" stroke="#EEE5E9" stroke-opacity="0.60" stroke-width="1.2"/><circle cx="891.7" cy="372.4" r="3.6" fill="#EEE5E9"/><text x="770" y="168" text-anchor="start" fill="#EEE5E9" font-family="ui-monospace,Menlo,monospace" font-size="13" font-weight="600">3. rotated by the FEET  +6.9337</text><text x="770" y="200" text-anchor="start" fill="#8FA3B0" font-family="ui-monospace,Menlo,monospace" font-size="11.5" font-weight="400">feet level</text><text x="1030" y="200" text-anchor="end" fill="#7FCE9B" font-family="ui-monospace,Menlo,monospace" font-size="11.5" font-weight="600">+0.000 pt</text><text x="770" y="220" text-anchor="start" fill="#8FA3B0" font-family="ui-monospace,Menlo,monospace" font-size="11.5" font-weight="400">apex centred</text><text x="1030" y="220" text-anchor="end" fill="#E8825C" font-family="ui-monospace,Menlo,monospace" font-size="11.5" font-weight="600">-2.385 pt</text><text x="770" y="240" text-anchor="start" fill="#8FA3B0" font-family="ui-monospace,Menlo,monospace" font-size="11.5" font-weight="400">axis vertical</text><text x="1030" y="240" text-anchor="end" fill="#E8825C" font-family="ui-monospace,Menlo,monospace" font-size="11.5" font-weight="600">+1.307 deg</text><text x="770" y="260" text-anchor="start" fill="#8FA3B0" font-family="ui-monospace,Menlo,monospace" font-size="11.5" font-weight="400">apex angle</text><text x="1030" y="260" text-anchor="end" fill="#7FCE9B" font-family="ui-monospace,Menlo,monospace" font-size="11.5" font-weight="600">42.582 deg</text><line x1="1092.2" y1="690.0" x2="1407.8" y2="690.0" stroke="#3D5361" stroke-width="1.5"/><line x1="1250.0" y1="706.0" x2="1250.0" y2="346.3" stroke="#3D5361" stroke-width="1.2" stroke-dasharray="5 4"/><path d="M 1126.19 690.00 L 1148.32 681.15 L 1250.37 404.22 L 1353.40 682.82 L 1373.81 690.00 L 1250.00 372.30 Z" fill="#EEE5E9" fill-opacity="0.30" stroke="#EEE5E9" stroke-opacity="0.60" stroke-width="1.2"/><circle cx="1250.0" cy="372.3" r="3.6" fill="#EEE5E9"/><text x="1120" y="168" text-anchor="start" fill="#EEE5E9" font-family="ui-monospace,Menlo,monospace" font-size="13" font-weight="600">4. build_A (lean + relevel)</text><text x="1120" y="200" text-anchor="start" fill="#8FA3B0" font-family="ui-monospace,Menlo,monospace" font-size="11.5" font-weight="400">feet level</text><text x="1380" y="200" text-anchor="end" fill="#7FCE9B" font-family="ui-monospace,Menlo,monospace" font-size="11.5" font-weight="600">+0.000 pt</text><text x="1120" y="220" text-anchor="start" fill="#8FA3B0" font-family="ui-monospace,Menlo,monospace" font-size="11.5" font-weight="400">apex centred</text><text x="1380" y="220" text-anchor="end" fill="#7FCE9B" font-family="ui-monospace,Menlo,monospace" font-size="11.5" font-weight="600">-0.000 pt</text><text x="1120" y="240" text-anchor="start" fill="#8FA3B0" font-family="ui-monospace,Menlo,monospace" font-size="11.5" font-weight="400">axis vertical</text><text x="1380" y="240" text-anchor="end" fill="#7FCE9B" font-family="ui-monospace,Menlo,monospace" font-size="11.5" font-weight="600">+0.000 deg</text><text x="1120" y="260" text-anchor="start" fill="#8FA3B0" font-family="ui-monospace,Menlo,monospace" font-size="11.5" font-weight="400">apex angle</text><text x="1380" y="260" text-anchor="end" fill="#7FCE9B" font-family="ui-monospace,Menlo,monospace" font-size="11.5" font-weight="600">42.582 deg</text><text x="30" y="770" text-anchor="start" fill="#EEE5E9" font-family="ui-monospace,Menlo,monospace" font-size="14" font-weight="600">Reading it</text><text x="30" y="798" text-anchor="start" fill="#8FA3B0" font-family="ui-monospace,Menlo,monospace" font-size="12" font-weight="400">1  as drawn: the A leans 5.63 deg inside the ring, its feet 8.54 pt apart in height, its apex 8.59 pt right of their midpoint.</text><text x="30" y="820" text-anchor="start" fill="#8FA3B0" font-family="ui-monospace,Menlo,monospace" font-size="12" font-weight="400">2  rotate to stand the axis vertical: the apex comes almost exactly over the feet&#8217;s midpoint (0.315 pt) &#8212; but the feet are still 1.61 out.</text><text x="30" y="842" text-anchor="start" fill="#8FA3B0" font-family="ui-monospace,Menlo,monospace" font-size="12" font-weight="400">3  rotate to level the feet instead: they level exactly, and the apex drifts to 2.385 pt off, seven times worse, with the axis 1.31 deg out.</text><text x="30" y="864" text-anchor="start" fill="#8FA3B0" font-family="ui-monospace,Menlo,monospace" font-size="12" font-weight="400">4  what build_A does: rotate by the lean, then slide each foot along its OWN LEG until the two are level. All three land at zero.</text><text x="30" y="902" text-anchor="start" fill="#EEE5E9" font-family="ui-monospace,Menlo,monospace" font-size="12" font-weight="400">Rotation alone can fix one of the three. Fixing all three costs 0.83-0.89 pt of movement at the four foot vertices; the apex and the</text><text x="30" y="924" text-anchor="start" fill="#8FA3B0" font-family="ui-monospace,Menlo,monospace" font-size="12" font-weight="400">counter apex do not move at all, and the 42.582 deg apex angle is rotation-invariant so it survives every option.</text></svg>