<svg xmlns="http://www.w3.org/2000/svg" width="1460" height="1180" viewBox="0 0 1460 1180"><rect width="1460" height="1180" fill="#1D2B35"/><text x="30" y="42" fill="#EEE5E9" font-family="ui-monospace,Menlo,monospace" font-size="20" font-weight="600">How literally to take the ring</text><text x="30" y="72" fill="#8FA3B0" font-family="ui-monospace,Menlo,monospace" font-size="12.5" font-weight="400">Centred on the ring, a chord&#8217;s tilt is CONSTANT at the ring&#8217;s own 19.87 deg and the rise scales with the span &#8212; what a real ring behind the</text><text x="30" y="94" fill="#8FA3B0" font-family="ui-monospace,Menlo,monospace" font-size="12.5" font-weight="400">page does. The shipped rule caps the rise at 90.77 instead, so a long bar flattens. The A&#8217;s own bar cannot tell them apart: its span, 251.11,</text><text x="30" y="116" fill="#8FA3B0" font-family="ui-monospace,Menlo,monospace" font-size="12.5" font-weight="400">is exactly where the two rules cross. Nothing in the mark decides between them.</text><text x="30" y="254" fill="#E0A458" font-family="ui-monospace,Menlo,monospace" font-size="13.5" font-weight="600">A. shipped</text><text x="30" y="275" fill="#8FA3B0" font-family="ui-monospace,Menlo,monospace" font-size="11.5" font-weight="400">rise capped 90.77 &#8212; an H bar flattens to 9.34 deg</text><g transform="translate(430,350) scale(0.245,-0.245)"><path d="M 99.37 14.80 L 93.39 689.78 L 66.20 700.00 L 60.00 0.00 Z M 618.00 0.00 L 611.80 700.00 L 584.61 689.78 L 578.63 14.80 Z M 62.78 296.52 C 77.72 300.97 92.70 305.28 107.73 309.44 C 207.42 337.05 308.89 358.24 411.30 372.83 C 478.67 382.43 546.43 389.18 614.37 393.06 L 614.12 421.30 C 600.05 420.75 585.98 420.09 571.92 419.30 C 467.21 413.42 362.90 400.79 259.81 381.52 C 193.67 369.16 128.03 354.07 63.13 336.30 Z" fill="#E0A458"/></g><g transform="translate(630.11,350) scale(0.245,-0.245)"><path d="M 99.37 14.80 L 93.39 689.78 L 66.20 700.00 L 60.00 0.00 Z M 66.20 700.00 L 79.98 663.34 L 468.