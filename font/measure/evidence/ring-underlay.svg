0" y="985" fill="#EEE5E9" font-family="ui-monospace,Menlo,monospace" font-size="13" font-weight="600">Short chords agree; only long ones diverge.</text><text x="30" y="1009" fill="#8FA3B0" font-family="ui-monospace,Menlo,monospace" font-size="12">The readings are identical below the 251.11 crossover, so the shorter a letter&#8217;s chord the less the choice matters.</text></svg>