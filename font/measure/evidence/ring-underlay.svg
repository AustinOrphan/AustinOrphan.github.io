<svg xmlns="http://www.w3.org/2000/svg" width="1460" height="1050" viewBox="0 0 1460 1050"><rect width="1460" height="1050" fill="#1D2B35"/><text x="30" y="42" fill="#EEE5E9" font-family="ui-monospace,Menlo,monospace" font-size="20" font-weight="600">The ring behind each letter</text><text x="30" y="72" fill="#8FA3B0" font-family="ui-monospace,Menlo,monospace" font-size="12.5" font-weight="400">The pale shape is the mark&#8217;s RING &#8212; the elliptical annulus whose front half is the A&#8217;s crossbar, hooks and all &#8212; at the scale the A puts it</text><text x="30" y="94" fill="#8FA3B0" font-family="ui-monospace,Menlo,monospace" font-size="12.5" font-weight="400">(7.888 units/pt), placed so its own centre lands on the letter&#8217;s chord centre, the white dot. Under &#8220;the ring exactly&#8221; a chord IS the piece</text><text x="30" y="116" fill="#8FA3B0" font-family="ui-monospace,Menlo,monospace" font-size="12.5" font-weight="400">of ring its span exposes, so those two centres coincide by definition rather than by fitting.</text><text x="300" y="170" fill="#E0A458" font-family="ui-monospace,Menlo,monospace" font-size="13.5" font-weight="600">A. shipped</text><text x="680" y="170" fill="#7FCE9B" font-family="ui-monospace,Menlo,monospace" font-size="13.5" font-weight="600">B. the ring exactly</text><text x="1060" y="170" fill="#C08FD0" font-family="ui-monospace,Menlo,monospace" font-size="13.5" font-weight="600">C. + the ring&#8217;s band</text><text x="30" y="320" fill="#EEE5E9" font-family="ui-monospace,Menlo,monospace" font-size="13.5" font-weight="600">H bar &#8212; ends 54 off the ring in A</text><text x="30" y="342" fill="#8FA3B0" font-family="ui-monospace,Menlo,monospace" font-size="11.5" font-weight="400">span 551.6</text><g transform="translate(250,450) scale(0.3,-0.3)"><g transform="translate(337.885,25.364)"><path d="M 382.88 473.15 C 375.61 494.38 340.44 502.01 286.71 498.26 C 282.15 497.94 277.45 497.53 272.63 497.06 C 197.92 489.60 92.39 46