2 30.71 21.77 32.56 C 21.17 33.50 20.61 34.47 20.09 35.46 C 16.75 35.10 14.70 35.31 14.38 36.21 C 14.08 37.06 15.40 38.44 18.00 40.18 C 19.32 41.06 20.95 42.03 22.87 43.06 C 30.29 47.06 41.91 52.07 55.23 56.83 C 69.75 62.02 82.90 65.69 91.12 67.07 C 91.76 67.18 92.36 67.27 92.94 67.35 C 97.02 67.91 99.54 67.75 99.90 66.76 C 100.27 65.73 98.27 63.93 94.51 61.66 C 94.67 60.88 94.79 60.10 94.90 59.30 C 100.92 62.75 104.14 65.91 103.21 68.63 Z M 19.29 8.64 L 25.66 11.19 L 54.78 90.23 L 84.17 10.71 L 90.04 8.64 L 54.67 99.41 Z M 60.37 19.57 C 47.26 18.28 35.10 24.16 27.77 34.02 C 27.19 34.80 26.64 35.61 26.12 36.45 C 24.83 38.52 23.73 40.73 22.88 43.06 C 22.20 44.90 21.67 46.81 21.30 48.78 C 21.10 49.84 20.93 50.93 20.82 52.03 C 18.86 71.91 33.40 89.62 53.28 91.58 C 68.67 93.09 82.74 84.73 89.23 71.66 C 89.96 70.19 90.59 68.65 91.12 67.07 C 91.82 64.99 92.33 62.82 92.65 60.58 C 92.71 60.10 92.78 59.61 92.83 59.12 C 92.86 58.81 92.87 58.50 92.89 58.19 C 94.32 38.69 79.94 21.50 60.37 19.57 Z M 88.47 42.84 C 89.74 42.01 100.08 35.00 102.15 22.83 C 102.48 20.92 104.18 10.93 98.41 6.22 C 97.86 5.77 94.39 2.95 90.23 4.15 C 86.15 5.33 84.63 9.43 84.47 9.91 C 85.40 9.74 86.49 9.48 87.68 9.05 C 88.72 8.67 89.61 8.24 90.36 7.83 C 91.91 7.53 93.82 7.44 95.20 8.50 C 99.82 12.05 97.08 27.31 88.73 36.30 C 76.81 49.15 56.51 45.89 54.49 45.54 C 49.77 44.71 45.58 43.05 38.05 40.06 C 31.11 37.31 25.56 34.56 21.77 32.56 C 21.21 33.53 20.65 34.50 20.09 35.46 C 22.39 36.23 26.00 37.47 30.42 39.05 C 38.33 41.88 43.36 43.88 44.95 44.47 C 47.15 45.29 71.10 54.24 88.47 42.84 Z" fill="#EEE5E9" fill-opacity="0.68" fill-rule="nonzero"/></g><line x1="1122.0" y1="620.0" x2="1398.0" y2="620.0" stroke="#44606F" stroke-width="1.6"/><line x1="1260.0" y1="638.0" x2="1260.0" y2="358.0" stroke="#44606F" stroke-width="1.2" stroke-dasharray="5 4"/><circle cx="1260.0" cy="384.0" r="3.6" fill="#7FCE9B"/><text x="1110" y="158" text-anchor="start" fill="#EEE5E9" font-family="ui-monospace,Menlo,monospace" font-size="13" font-weight="600">4. lean, then feet relevelled</text><text x="1110" y="190" text-anchor="start" fill="#8FA3B0" font-family="ui-monospace,Menlo,monospace" font-size="11.5" font-weight="400">feet level</text><text x="1410" y="190" text-anchor="end" fill="#7FCE9B" font-family="ui-monospace,Menlo,monospace" font-size="11.5" font-weight="600">+0.000 pt</text><text x="1110" y="210" text-anchor="start" fill="#8FA3B0" font-family="ui-monospace,Menlo,monospace" font-size="11.5" font-weight="400">apex centred</text><text x="1410" y="210" text-anchor="end" fill="#7FCE9B" font-family="ui-monospace,Menlo,monospace" font-size="11.5" font-weight="600">-0.000 pt</text><text x="30" y="720" text-anchor="start" fill="#EEE5E9" font-family="ui-monospace,Menlo,monospace" font-size="14" font-weight="600">What each does to the LOGO, as opposed to the letter</text><text x="30" y="748" text-anchor="start" fill="#8FA3B0" font-family="ui-monospace,Menlo,monospace" font-size="12" font-weight="400">1  the mark as it is. The A leans inside the ring and the ring sits level; that lean is the composition, not an error.</text><text x="30" y="770" text-anchor="start" fill="#8FA3B0" font-family="ui-monospace,Menlo,monospace" font-size="12" font-weight="400">2  standing the A&#8217;s axis up tips the whole mark 5.63 deg, so the ring is no longer level. The A is upright; the logo is not.</text><text x="30" y="792" text-anchor="start" fill="#8FA3B0" font-family="ui-monospace,Menlo,monospace" font-size="12" font-weight="400">3  levelling the feet tips it 6.93 deg &#8212; further &#8212; and the apex still sits 2.4 pt off centre. Worst of both.</text><text x="30" y="814" text-anchor="start" fill="#8FA3B0" font-family="ui-monospace,Menlo,monospace" font-size="12" font-weight="400">4  what the font does. This is not a rotation OF the logo: the A is taken OUT of it and stood up alone, which is why the ring can</text><text x="30" y="836" text-anchor="start" fill="#8FA3B0" font-family="ui-monospace,Menlo,monospace" font-size="12" font-weight="400">   stay where it is. In the font the ring becomes the O, a separate glyph, so nothing has to be tipped at all.</text><text x="30" y="876" text-anchor="start" fill="#5E7382" font-family="ui-monospace,Menlo,monospace" font-size="11.5" font-weight="400">SPEC 2.3 already lists the A&#8217;s lean as composition rather than letterform. This is what that means in practice.</text></svg>