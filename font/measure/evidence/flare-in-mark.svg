t that already reads as the A&#8217;s feet sticking out of the ring.</text><text x="30" y="616" fill="#EEE5E9" font-family="ui-monospace,Menlo,monospace" font-size="12.5" font-weight="400">Note this is the FONT&#8217;s A in the mark&#8217;s place, not the mark&#8217;s own A. The logo on the site is unaffected either way &#8212; the flare is</text><text x="30" y="638" fill="#EEE5E9" font-family="ui-monospace,Menlo,monospace" font-size="12.5" font-weight="400">a font decision. This only shows what the letter would look like if the mark were redrawn to match it.</text></svg>