chor="start" fill="#8FA3B0" font-family="ui-monospace,Menlo,monospace" font-size="12" font-weight="400">by, so the A and the letters that borrow its ring move together. It follows PUSH too: at PUSH 0.30 the band is 37.65.</text><text x="30" y="1190" text-anchor="start" fill="#5E7382" font-family="ui-monospace,Menlo,monospace" font-size="11" font-weight="400">&#8220;Before&#8221; is the WEIGHT 1 drawing repeated, which is exactly what frozen meant.</text></svg>