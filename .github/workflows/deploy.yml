name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - run: npm ci

      # `npm run build` runs scripts/sync-blog.mjs first, which reads
      # markdown from $VAULT_PATH (default: ./test-vault) and writes
      # transformed posts into src/content/blog/ before Astro builds.
      # When the real vault is set up:
      #   1. Add a `Check out vault` step using actions/checkout@v4 with
      #      `repository: austinorphan/<vault-repo>`, `path: .vault`,
      #      and `ssh-key: ${{ secrets.VAULT_DEPLOY_KEY }}`
      #   2. Set `VAULT_PATH: ${{ github.workspace }}/.vault` on this step
      #   3. Add `schedule: - cron: '0 13 * * *'` to the workflow triggers
      #      so future-dated posts get released automatically
      - run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
