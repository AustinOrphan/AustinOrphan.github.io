name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  schedule:
    # Daily, so future-dated posts publish themselves once pubDate arrives.
    - cron: '0 13 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Published blog notes, exported from the Obsidian vault by
      # scripts/export-vault.mjs. Contains only notes marked `publish: true`;
      # the vault itself is never uploaded. Read-only deploy key.
      - name: Check out vault export
        uses: actions/checkout@v4
        with:
          repository: AustinOrphan/blog-vault-export
          path: .vault
          ssh-key: ${{ secrets.VAULT_DEPLOY_KEY }}

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - run: npm ci

      # `npm run build` runs scripts/sync-blog.mjs first, which reads markdown
      # from $VAULT_PATH and writes transformed posts into src/content/blog/
      # before Astro builds.
      - run: npm run build
        env:
          VAULT_PATH: ${{ github.workspace }}/.vault

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
